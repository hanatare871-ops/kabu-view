<head>

<title>底からの急騰</title>
<style>
:root{--bg:#0f1419;--panel:#171e26;--line:#26303b;--text:#e3e8ee;--sub:#8b97a5;
--ma5:#FF5A52;--ma25:#F5C542;--ma75:#4FD18B;--up:#e3e8ee;--dn:#5d7fa8;--acc:#F5C542;--long:#FF8A5B;--short:#5BC0FF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{padding:18px 16px 10px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.cond{color:var(--sub);font-size:13px}
.cond b{font-weight:600;color:var(--text)}
.stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub);margin-top:8px}
.stat span b{color:var(--text);font-weight:600}
.warn{background:#3a2a12;color:#f5c542;padding:6px 10px;border-radius:6px;font-size:12px;margin-top:8px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar-in .lbl{font-size:12px;color:var(--sub)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dl{margin-left:auto;font-size:13px}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
.row{border-bottom:1px solid var(--line)}
.head{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:10px 2px;cursor:pointer}
.nm{font-weight:600}.nm small{color:var(--sub);font-weight:400;margin-right:6px}
.px{text-align:right;font-variant-numeric:tabular-nums}
.sc{min-width:64px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.sc small{font-size:11px;color:var(--sub);font-weight:400}
.meta{grid-column:1/-1;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.meta i{font-style:normal;color:var(--text)}
.meta span{white-space:nowrap;margin-right:10px}
.detail{display:none;padding:0 0 14px}
.row.open .detail{display:block}
canvas{width:100%;height:280px;display:block;background:var(--panel);border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--sub);margin:6px 2px}
.legend b{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.tv{font-size:12px;margin:6px 2px}.tv a{color:var(--acc)}
h2{font-size:15px;margin:22px 0 4px;font-weight:700}
h2 small{color:var(--sub);font-weight:400;margin-left:6px}
h2 .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.day{font-size:12px;color:var(--sub);margin:14px 0 0;padding:4px 2px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.tag.long{color:var(--bg);background:var(--long)}.tag.short{color:var(--bg);background:var(--short)}
.tag.stop{color:var(--bg);background:var(--ma5)}
.pl{color:#4FD18B}.mi{color:#FF5A52}
.empty{color:var(--sub);padding:20px 0;text-align:center}
details{font-size:12px;color:var(--sub);margin-top:8px}
details p{margin:6px 0}
</style>
</head>

const LB={vmult:"出来高倍率",ret:"前日比"};
function label(){
  document.querySelectorAll("[data-k]").forEach(b=>{
    const on=b.dataset.k===key;b.classList.toggle("on",on);
    b.textContent=LB[b.dataset.k]+(on?(dir<0?" ▼":" ▲"):"");b.setAttribute("aria-pressed",on);
  });
}
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
  if(key===b.dataset.k)dir=-dir; else{key=b.dataset.k;dir=-1}
  render();
});
const sg=v=>(v>0?"+":"")+v.toFixed(1)+"%";
const ALL=[...D.items.map(x=>({...x,today:1})),...D.hist];
const cmp=(a,b)=>(a[key]-b[key])*dir;
function rowHTML(x,showKind){
  const i=ALL.indexOf(x);
  const tags=(showKind?`<span class="tag ${x.kind}">${KN[x.kind]}</span>`:"")+(x.stop?`<span class="tag stop">${SN[x.stop]}</span>`:"");
  const now=x.today?"":`<span>現在比 <i class="${x.chg>=0?"pl":"mi"}">${sg(x.chg)}</i></span>`;
  const lim=x.stop==="close"?"":`<span>S高まで <i>${x.to_limit.toLocaleString()}円</i></span>`;
  return `<div class="row" data-i="${i}">
   <div class="head" tabindex="0" role="button" aria-expanded="false">
    <div class="nm"><small>${x.code}</small>${x.name||""}${tags}</div>
    <div class="px">${x.price.toLocaleString()}円 <span class="${x.ret>=0?"pl":"mi"}">${sg(x.ret)}</span></div>
    <div class="sc">${x.vmult>=100?Math.round(x.vmult):x.vmult.toFixed(1)}<small>倍</small></div>
    <div class="meta">${now}<span>高値時 <i>${sg(x.hiret)}</i></span><span>上ヒゲ <i>${x.wickp}%</i></span><span>引け位置 <i>${x.cpos}%</i></span><span>横ばい幅 <i>${x.base}%</i></span><span>売買代金 <i>${x.tov}億</i></span>${lim}</div>
   </div><div class="detail"></div></div>`;
}
function render(){
  label();
  let h=`<h2>本日の検出<small>${D.items.length}件</small></h2>`;
  if(!D.items.length)h+='<div class="empty">今日は条件に合う銘柄がありません。</div>';
  for(const k of ["long","short"]){
    const g=ALL.filter(x=>x.today&&x.kind===k).sort(cmp);
    if(!g.length)continue;
    h+=`<h2 style="font-size:14px;margin-top:14px"><span class="k" style="background:var(--${k})"></span>${KN[k]}<small>${g.length}件</small></h2>`+g.map(x=>rowHTML(x,false)).join("");
  }
  h+=`<h2>過去の検出<small>直近${D.hist_days}営業日・価格は検出日の終値</small></h2>`;
  const hs=ALL.filter(x=>!x.today);
  if(!hs.length)h+='<div class="empty">期間内の検出はありません。</div>';
  for(const d of [...new Set(hs.map(x=>x.ds))]){
    const g=hs.filter(x=>x.ds===d).sort(cmp);
    h+=`<div class="day">${d}　${g.length}件</div>`+g.map(x=>rowHTML(x,true)).join("");
  }
  $("#list").innerHTML=h;
}
$("#list").addEventListener("click",e=>toggle(e));

async function toggle(e){
  const h=e.target.closest(".head"); if(!h)return;
  const row=h.parentElement, open=row.classList.toggle("open");

  if(!open)return;
  const det=row.querySelector(".detail"), x=ALL[+row.dataset.i], code=x.code;
  if(!CH){det.textContent="チャート読み込み中…";try{CH=await (await fetch("charts.json")).json()}catch{det.textContent="チャートを読み込めませんでした。";return}}

  draw(det.querySelector("canvas"),CH[code]);
}
function draw(cv,c){
  if(!c)return;
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*r;cv.height=H*r;const g=cv.getContext("2d");g.scale(r,r);
  const L=6,R=52,T=10,VH=H*0.18,PH=H-T-VH-22,n=c.c.length,bw=(W-L-R)/n;
  const vals=[...c.h,...c.l,...c.m5,...c.m25,...c.m75].filter(v=>v!=null);
  let hi=Math.max(...vals),lo=Math.min(...vals);const pad=(hi-lo)*0.05;hi+=pad;lo-=pad;
  const y=v=>T+(hi-v)/(hi-lo)*PH,xc=i=>L+bw*(i+0.5);
  g.font="10px sans-serif";g.fillStyle=col("--sub");g.strokeStyle=col("--line");g.lineWidth=1;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v);g.beginPath();g.moveTo(L,yy);g.lineTo(W-R,yy);g.stroke();g.fillText(Math.round(v).toLocaleString(),W-R+4,yy+3)}
  const vmax=Math.max(...c.v)||1,vb=H-18;
  for(let i=0;i<n;i++){
    const up=c.c[i]>=c.o[i];g.fillStyle=up?"rgba(227,232,238,.28)":"rgba(93,127,168,.5)";
    const vh=c.v[i]/vmax*VH;g.fillRect(xc(i)-bw*0.35,vb-vh,bw*0.7,vh);
    g.strokeStyle=up?col("--up"):col("--dn");g.fillStyle=col("--dn");
    g.beginPath();g.moveTo(xc(i),y(c.h[i]));g.lineTo(xc(i),y(c.l[i]));g.stroke();
    const t=y(Math.max(c.o[i],c.c[i])),b=y(Math.min(c.o[i],c.c[i])),w=Math.max(bw*0.6,1);
    if(up){g.fillStyle=col("--bg");g.fillRect(xc(i)-w/2,t,w,Math.max(b-t,1));g.strokeRect(xc(i)-w/2,t,w,Math.max(b-t,1))}
    else g.fillRect(xc(i)-w/2,t,w,Math.max(b-t,1));
  }
  for(const [k,cl] of [["m75","--ma75"],["m25","--ma25"],["m5","--ma5"]]){
    g.strokeStyle=col(cl);g.lineWidth=1.4;g.beginPath();let s=false;
    c[k].forEach((v,i)=>{if(v==null){s=false;return}s?g.lineTo(xc(i),y(v)):g.moveTo(xc(i),y(v));s=true});g.stroke();
  }
  g.fillStyle=col("--acc");g.textAlign="center";
  for(const i of (c.mk||[]))g.fillText("▲",xc(i),Math.min(y(c.l[i])+12,vb-VH-2));
  g.textAlign="left";g.fillStyle=col("--sub");
  for(let i=0;i<n;i+=Math.ceil(n/5))g.fillText(c.d[i],xc(i)-12,H-4);
}
$("#dl").onclick=()=>{
  let txt="";
  for(const k of ["long","short"]){
    const g=D.items.filter(x=>x.kind===k).sort(cmp);
    if(g.length)txt+=`###${KN[k]} ${D.date}\n`+g.map(x=>"TSE:"+x.code).join(",")+"\n";
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt||"###該当なし\n"],{type:"text/plain"}));
  a.download=`bottom_surge_${D.date}.txt`;a.click();
};
