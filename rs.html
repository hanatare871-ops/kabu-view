<style>

  .search {
    width: 100%;

  .search:focus, .chip:focus-visible, .more:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }

  .row2 { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: 13px;
    padding: 7px 12px;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .count { margin-top: 10px; font-size: 12px; color: var(--muted); }

  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 42px 1fr 58px auto;
    gap: 0 10px;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
  }
  .rank {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-align: right;
  }
  .r-hi { color: var(--strong); }
  .r-lo { color: var(--weak); }

  .who { min-width: 0; }
  .nm {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .num { text-align: right; font-size: 14px; white-space: nowrap; }
  .delta { font-size: 12px; margin-top: 3px; text-align: right; }
  .up { color: var(--strong); }
  .down { color: var(--weak); }
  .flat { color: var(--muted); }

  /* この20営業日でランクが上がってきたか落ちてきたかの軌跡 */
  .spark { display: block; width: 58px; height: 22px; overflow: visible; }
  .spark polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .spark circle { r: 1.9; stroke: none; }
  .s-up polyline, .s-up circle { stroke: var(--strong); fill: none; }
  .s-up circle { fill: var(--strong); }
  .s-dn polyline, .s-dn circle { stroke: var(--weak); fill: none; }
  .s-dn circle { fill: var(--weak); }
  .s-fl polyline, .s-fl circle { stroke: #9aa6b0; fill: none; }
  .s-fl circle { fill: #9aa6b0; }

  .more {
    display: block; width: 100%;
    margin-top: 20px; padding: 13px;
    font: inherit; font-size: 14px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 9px;
    cursor: pointer;
  }
  .empty { padding: 44px 4px; color: var(--muted); font-size: 14px; line-height: 1.8; }
  .note { margin-top: 28px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  @media (min-width: 620px) {
    h1 { font-size: 33px; }
    li { grid-template-columns: 54px 1fr 78px 96px; gap: 0 18px; padding: 14px 0; }
    .rank { font-size: 29px; }
    .spark { width: 78px; height: 24px; }
  }
</style>

const HAS_DELTA = true;
const HAS_PRICE = true;
const STEP = 100;

const listEl = document.getElementById('list');
const moreEl = document.getElementById('more');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');

let minRank = 0;
let query = '';
let shown = STEP;

const yen = n => n >= 10000 ? n.toLocaleString('ja-JP', {maximumFractionDigits: 0})
                            : n.toLocaleString('ja-JP', {maximumFractionDigits: 1});

function filtered() {
  const q = query.trim().toLowerCase();
  return DATA.filter(d =>
    d.r >= minRank &&
    (!q || d.c.toLowerCase().includes(q) || (d.n && d.n.toLowerCase().includes(q)))
  );
}

function render() {
  const rows = filtered();
  const slice = rows.slice(0, shown);

  countEl.textContent = rows.length
    ? `${rows.length.toLocaleString('ja-JP')}銘柄`
    : '';

  if (!rows.length) {
    listEl.innerHTML =
      '<li class="empty">あてはまる銘柄がありません。<br>絞り込みを緩めてください。</li>';
    moreEl.hidden = true;
    return;
  }

  listEl.innerHTML = slice.map(d => {
    const cls = d.r >= 80 ? 'r-hi' : (d.r <= 20 ? 'r-lo' : '');
    const sub = [d.c, d.m].filter(Boolean).join('　');
    let delta = '';
    if (HAS_DELTA && d.d !== null && d.d !== undefined) {
      const k = d.d > 0 ? 'up' : (d.d < 0 ? 'down' : 'flat');
      const s = d.d > 0 ? '+' + d.d : (d.d === 0 ? '±0' : String(d.d));
      delta = `<div class="delta ${k}">${s}</div>`;
    }
    const price = HAS_PRICE && d.p != null ? `<div class="num">${yen(d.p)}</div>` : '';
    return `<li>
      <div class="rank ${cls}">${d.r}</div>
      <div class="who">
        <div class="nm">${d.n ? esc(d.n) : d.c}</div>
        <div class="sub">${esc(sub)}</div>
      </div>
      ${spark(d.s)}
      <div>${price}${delta}</div>
    </li>`;
  }).join('');

  moreEl.hidden = rows.length <= shown;
  moreEl.textContent = `さらに表示（残り ${(rows.length - shown).toLocaleString('ja-JP')}）`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ランクの推移を小さな折れ線にする。縦軸は常に1〜99で固定。
function spark(series) {
  if (!series || series.length < 2) return '<div></div>';
  const n = series.length;
  const pts = series.map((v, i) => {
    const x = (i / (n - 1)) * 56 + 1;
    const y = 21 - ((v - 1) / 98) * 20;
    return [x, y];
  });
  const diff = series[n - 1] - series[0];
  const cls = diff > 3 ? 's-up' : (diff < -3 ? 's-dn' : 's-fl');
  const last = pts[n - 1];
  return `<svg class="spark ${cls}" viewBox="0 0 58 22" role="img"
    aria-label="ランクの推移 ${series[0]}から${series[n-1]}">
    <polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}"/>
  </svg>`;
}

qEl.addEventListener('input', e => { query = e.target.value; shown = STEP; render(); });

document.querySelectorAll('.chip').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    minRank = Number(b.dataset.min);
    shown = STEP;
    render();
  });
});

moreEl.addEventListener('click', () => { shown += STEP; render(); });

render();
</script>
